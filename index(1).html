<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VALØR // Command Network</title>
<style>
:root{--bg:#050308;--panel:#0d0813;--panel2:#120b1a;--purple:#9b4dff;--violet:#c46cff;--text:#f4ecff;--muted:#9b8da8;--line:#2a1738;--ok:#9dffcf;--danger:#ff6b91}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}body{min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(155,77,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(155,77,255,.035) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,#000,transparent 90%);z-index:0}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 10%,rgba(155,77,255,.15),transparent 35%),radial-gradient(circle at 10% 80%,rgba(116,0,255,.08),transparent 30%);z-index:0}
button,input{font:inherit}.hidden{display:none!important}
#welcome{position:fixed;inset:0;z-index:100;background:#030205;display:grid;place-items:center;overflow:hidden}
.welcome-grid{position:absolute;inset:-20%;background:linear-gradient(rgba(155,77,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(155,77,255,.08) 1px,transparent 1px);background-size:55px 55px;transform:perspective(500px) rotateX(62deg) translateY(22%);animation:gridmove 10s linear infinite}
@keyframes gridmove{to{background-position:0 55px,55px 0}}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(255,255,255,.018) 6px);pointer-events:none}
.stars{position:absolute;inset:0;background-image:radial-gradient(#c46cff 1px,transparent 1px);background-size:73px 73px;opacity:.22;animation:stars 18s linear infinite}
@keyframes stars{to{background-position:73px 73px}}
.welcome-card{text-align:center;position:relative;z-index:2}.mark{font-size:clamp(4rem,13vw,10rem);font-weight:1000;letter-spacing:.12em;text-shadow:0 0 8px #fff,0 0 25px var(--purple),0 0 65px var(--purple);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.35);text-shadow:0 0 10px #fff,0 0 38px var(--purple),0 0 100px var(--purple)}}
.kicker{letter-spacing:.5em;color:var(--violet);font-size:.8rem}.welcome-card p{color:var(--muted)}.enter{margin-top:28px;padding:14px 30px;border:1px solid var(--purple);background:rgba(155,77,255,.08);color:#fff;border-radius:4px;cursor:pointer;box-shadow:0 0 25px rgba(155,77,255,.25);transition:.25s}.enter:hover{background:var(--purple);box-shadow:0 0 45px rgba(155,77,255,.55);transform:translateY(-2px)}
#app{position:relative;z-index:1}.top{position:sticky;top:0;z-index:20;background:rgba(5,3,8,.84);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:14px 4vw;display:flex;align-items:center;gap:24px}.brand{font-weight:1000;letter-spacing:.16em;text-shadow:0 0 18px var(--purple);white-space:nowrap}.nav{display:flex;gap:6px;overflow:auto}.nav button{background:transparent;border:1px solid transparent;color:#bbaac8;padding:9px 11px;cursor:pointer;white-space:nowrap}.nav button:hover,.nav button.active{color:#fff;border-color:#39214d;background:#130b1b;box-shadow:0 0 18px rgba(155,77,255,.14)}
main{width:min(1180px,92vw);margin:auto;padding:45px 0 80px}.hero{padding:42px 0 28px}.eyebrow{color:var(--violet);letter-spacing:.3em;font-size:.75rem}.hero h1{font-size:clamp(2.5rem,6vw,5rem);margin:10px 0;text-shadow:0 0 28px rgba(155,77,255,.35)}.hero p{color:var(--muted);max-width:720px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:linear-gradient(145deg,rgba(18,11,26,.95),rgba(8,5,12,.95));border:1px solid var(--line);padding:20px;border-radius:8px;box-shadow:inset 0 0 30px rgba(155,77,255,.025);transition:.25s}.card:hover{border-color:#573276;transform:translateY(-2px);box-shadow:0 0 28px rgba(155,77,255,.09)}.card h3{margin:0 0 8px}.value{font-size:1.8rem;font-weight:800}.muted{color:var(--muted)}.purple{color:var(--violet)}.ok{color:var(--ok)}.danger{color:var(--danger)}
.section{margin-top:28px}.section h2{font-size:1.1rem;letter-spacing:.16em;text-transform:uppercase}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:15px;padding:13px;border:1px solid var(--line);background:#0b0710}.tag{border:1px solid #43265a;padding:4px 8px;color:var(--violet);font-size:.75rem}
table{width:100%;border-collapse:collapse}.table-wrap{overflow:auto}.table-wrap td,.table-wrap th{text-align:left;padding:13px;border-bottom:1px solid var(--line)}.table-wrap th{color:var(--violet);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em}
.notice{border-left:3px solid var(--purple);padding:14px 17px;background:#10091a;color:#d8cce1}.admin-login{max-width:600px}.admin-login input{width:100%;padding:14px;background:#08050b;color:#fff;border:1px solid #39214d;outline:none;margin:8px 0}.admin-login button,.action{padding:11px 16px;border:1px solid var(--purple);background:#160b21;color:#fff;cursor:pointer}.admin-result{margin-top:15px;min-height:35px}.admin-panel{display:none}.admin-panel.show{display:block}.admin-bar{padding:18px;border:1px solid #55306f;background:linear-gradient(90deg,#150a20,#0b0710);margin-bottom:15px}.permission{font-size:.78rem;color:var(--ok);letter-spacing:.08em}.footer{border-top:1px solid var(--line);padding:25px 4vw;color:#6e6078;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:80;display:grid;place-items:center}.modalbox{width:min(520px,90vw);padding:35px;background:#0d0813;border:1px solid var(--purple);box-shadow:0 0 60px rgba(155,77,255,.3);text-align:center}.access{font-size:2rem;color:var(--ok);text-shadow:0 0 20px rgba(157,255,207,.5)}@media(max-width:750px){.top{align-items:flex-start;flex-direction:column;gap:10px}.nav{width:100%}}
</style>
</head>
<body>
<div id="welcome">
  <div class="stars"></div><div class="welcome-grid"></div><div class="scan"></div>
  <div class="welcome-card">
    <div class="kicker">COMPETITIVE ROBLOX // KNIFE DIVISION</div>
    <div class="mark">VALØR</div>
    <p>COMMAND NETWORK • INFINITY / T5</p>
    <button class="enter" onclick="enterValor()">ENTER VALØR</button>
  </div>
</div>

<div id="app" class="hidden">
<header class="top">
  <div class="brand">VALØR</div>
  <nav class="nav" id="nav"></nav>
</header>
<main id="content"></main>
<footer class="footer">VALØR COMMAND NETWORK • Roblox Knife Clan • Founded 31 July 2026</footer>
</div>

<div id="accessModal" class="modal hidden"><div class="modalbox">
  <div class="access">ACCESS GRANTED</div><h2 id="welcomeName"></h2><p id="welcomeRole"></p><div class="purple" id="welcomeLevel"></div>
</div></div>

<script>
const admins={
 "00VYANE-VALOR-CLAN-RIVALS-QAWSEDRFTGYHUJIKOL":{name:"00Vyane",role:"Web Founder-Creator",level:5},
 "VALOR-DAMJAN-OWNER-7XK9M2Q8":{name:"Damjan",role:"Owner",level:4},
 "VALOR-VALOR-OWNER-4P7N8Z3L":{name:"Valor",role:"Owner",level:4},
 "VALOR-GERRARD-COOWNER-6R2K9V5M":{name:"Gerrard",role:"Co-owner",level:3}
};
const pages=[
 ["home","HOME"],["war","WAR ROOM"],["tiers","TIER RANKING"],["roster","ROSTER"],["divisions","DIVISIONS"],
 ["rules","RULES"],["faq","FAQ"],["media","MEDIA"],["intel","INTEL"],["devs","DEVS"],["admin","ADMIN"]
];
const devs=["×× ηθ€an","VALOR","VΛLØR_[Бан]Даниил","BLEED ☠️jffr","TURTLE ⚡TFN","GerrardSUSNPC","Specter 🥀 G122 👑","VALOR_ME 💙OwO","VALØR | Vxz","00Vyane"];
const leadership=[["00Vyane","Web Founder-Creator"],["Damjan","Owner"],["Valor","Owner"],["Gerrard","Co-owner"]];
const warGroups=[
"AMD • SFG • K1 • FIRE • RS • HDX • SELF • ZL • QLC",
"PROP • A1M • ALLROUNDER • STRIKE • R3 • XP • ASTRAL • RMXD",
"NEXOR • KAIZEN • VULCAN • SL • VOID • DYW • ASH • 42 • OUTLAW • RYZ • CUBE • V4X",
"ACTIVE WAR - NH"
];

function enterValor(){document.getElementById("welcome").style.display="none";document.getElementById("app").classList.remove("hidden");go("home")}
function go(page){history.replaceState(null,"","#"+page);render(page)}
function initNav(){document.getElementById("nav").innerHTML=pages.map(([id,label])=>`<button data-page="${id}" onclick="go('${id}')">${label}</button>`).join("")}
function shell(title,eyebrow,text,body=""){return `<div class="hero"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${text}</p></div>${body}`}
function cards(items){return `<div class="grid">${items.map(x=>`<div class="card"><h3>${x[0]}</h3><div class="value">${x[1]}</div>${x[2]?`<div class="muted">${x[2]}</div>`:""}</div>`).join("")}</div>`}
function render(page){
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 let c="";
 if(page==="home") c=shell("WELCOME TO VALØR","COMMAND NETWORK","A professional dark/neon command interface for VALØR. Official statistics remain configurable where confirmation is still required.",
 cards([["GAME","Roblox"],["WEAPON","Knife"],["MEMBERS","220+"],["CREATED","31 July 2026"],["TIER","Infinity / T5"],["CLAN WARS","30+ wins"],["WIN RATE","CONFIGURABLE","10% / 100% supplied — confirm official value"],["STATUS","ACTIVE","Command network online"]])+
 `<div class="section"><h2>Leadership</h2><div class="list">${leadership.map((x,i)=>`<div class="row"><span>${i===0?"🥇 ":"👑 "}<b>${x[0]}</b></span><span class="muted">${x[1]}</span></div>`).join("")}</div></div>`);
 else if(page==="war") c=shell("WAR ROOM","LIVE OPERATIONS","War information, roster, opponent intelligence and preserved war-group data.",
 cards([["ACTIVE WAR","NH"],["OPPONENT","IGN / TSN","Opponent information supplied as incomplete"],["WAR ROSTER","5 PLAYERS"],["SCORE","TBD"],["RESULT","TBD"],["STATUS","ACTIVE"]])+
 `<div class="section"><h2>War Roster</h2><div class="list">${["Ban_danil","6ipzz","Damjan","Bleed","Valor"].map(x=>`<div class="row">${x}<span class="tag">WAR ROSTER</span></div>`).join("")}</div></div>
 <div class="section"><h2>War Groups</h2><div class="list">${warGroups.map(x=>`<div class="row">${x}</div>`).join("")}</div></div>`);
 else if(page==="tiers") c=shell("TIER RANKING","COMPETITIVE LADDER","Current clan tier information supplied for VALØR.",
 cards([["CURRENT TIER","Infinity / T5"],["RANKING","Infinity → T5"],["WAR WINS","30+"]])+`<div class="section"><div class="notice">No individual player tier statistics were supplied, so none are invented here.</div></div>`);
 else if(page==="roster") c=shell("STAFF & ROSTER","PERSONNEL","Leadership and known war roster.",
 `<div class="section"><h2>Leadership</h2><div class="list">${leadership.map((x,i)=>`<div class="row"><b>${i+1}. ${x[0]}</b><span class="muted">${x[1]}</span></div>`).join("")}</div></div>
 <div class="section"><h2>Known War Roster</h2>${cards([["MEMBERS","220+"],["WAR ROSTER","Ban_danil • 6ipzz • Damjan • Bleed • Valor"]])}</div>`);
 else if(page==="divisions") c=shell("COMBAT DIVISIONS","COMBAT STRUCTURE","Dedicated division command area. Official division names, captains and records have not been supplied.",
 `<div class="notice">Division data is intentionally left unfilled rather than inventing official names or statistics.</div>`);
 else if(page==="rules") c=shell("RULES & CODEX","CODEX","Official clan rules area.","<div class=\"notice\">No official rules were supplied in the project specification. Add them through the Admin Hub when ready.</div>");
 else if(page==="faq") c=shell("FAQ KNOWLEDGE","KNOWLEDGE BASE","Common VALØR information.",
 cards([["What game?","Roblox"],["Weapon?","Knife"],["Members?","220+"],["Created?","31 July 2026"],["Tier?","Infinity / T5"],["Clan wars?","30+ wins"]])+`<div class="section"><div class="notice">Official answers can be expanded from the Admin Hub.</div></div>`);
 else if(page==="media") c=shell("MEDIA VAULT","CLAN MEDIA","Screenshots, clips and featured VALØR media.",
 `<div class="notice">No media files were supplied with this build. The vault is ready for media entries.</div>`);
 else if(page==="intel") c=shell("INTEL FEED","INTELLIGENCE","Announcements, latest updates and important notices.",
 `<div class="notice"><b>INTEL:</b> Active war status: NH. Further official announcements can be managed from Admin.</div>`);
 else if(page==="devs") c=shell("DEVELOPERS","BUILD TEAM","VALØR developers supplied for the project.",
 `<div class="table-wrap"><table><thead><tr><th>#</th><th>Developer</th></tr></thead><tbody>${devs.map((x,i)=>`<tr><td>${i+1}</td><td>${x}</td></tr>`).join("")}</tbody></table></div>`);
 else if(page==="admin") c=shell("ADMIN HUB","RESTRICTED COMMAND","Front-end administrative interface. GitHub Pages cannot provide secure server-side authentication.",
 `<div class="admin-login card"><h3>ADMIN PASSKEY</h3><p class="muted">Only the four configured administrators are recognized by this demo.</p><input id="passkey" type="password" placeholder="Enter passkey" autocomplete="off"><button class="action" onclick="login()">AUTHENTICATE</button><div class="admin-result" id="adminResult"></div></div>
 <div id="adminPanel" class="admin-panel section"></div>`);
 document.getElementById("content").innerHTML=c;
 if(page==="admin" && window.currentAdmin) showAdmin(window.currentAdmin);
}
function login(){
 const key=document.getElementById("passkey").value;
 const admin=admins[key];
 const out=document.getElementById("adminResult");
 if(!admin){out.innerHTML='<span class="danger">ACCESS DENIED — INVALID PASSKEY</span>';return}
 window.currentAdmin=admin;
 document.getElementById("welcomeName").textContent="WELCOME, "+admin.name;
 document.getElementById("welcomeRole").textContent=admin.role;
 document.getElementById("welcomeLevel").textContent="COMMAND LEVEL "+admin.level;
 document.getElementById("accessModal").classList.remove("hidden");
 setTimeout(()=>{document.getElementById("accessModal").classList.add("hidden");showAdmin(admin)},1500);
}
function showAdmin(admin){
 const panel=document.getElementById("adminPanel"); if(!panel)return;
 const controls=[
 ["Dashboard",1],["Announcements",1],["War Management",3],["Active War",3],["Roster Management",3],
 ["Staff Management",4],["Rank Management",4],["Stats Management",3],["Intel Feed",3],["Media Management",3],
 ["Rules Management",3],["FAQ Management",3],["Developer Management",4],["Homepage Management",3],
 ["Links Management",3],["Site Appearance",5],["Admin Management",5],["Audit Log",3]
 ];
 panel.innerHTML=`<div class="admin-bar"><b>${admin.name}</b> • ${admin.role} <span class="permission">LVL ${admin.level}</span></div>
 <div class="grid">${controls.map(x=>`<div class="card"><h3>${x[0]}</h3><span class="${admin.level>=x[1]?"ok":"danger"}">${admin.level>=x[1]?"ACCESS":"LOCKED"} · LVL ${x[1]}</span></div>`).join("")}</div>
 <div class="section notice">This is a client-side GitHub Pages demo. Passkeys and permissions in this file are inspectable by users with technical access to the source. Do not use these passkeys for real security.</div>`;
 panel.classList.add("show");
}
window.addEventListener("hashchange",()=>{const p=location.hash.slice(1)||"home";render(p)});
initNav();
</script>

<style>
.edit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px;margin-top:18px}
.edit-card{background:linear-gradient(145deg,rgba(18,11,26,.98),rgba(8,5,12,.98));border:1px solid var(--line);padding:18px;border-radius:8px}
.edit-card button,.editor button{margin-top:10px;padding:9px 13px;border:1px solid var(--purple);background:#160b21;color:#fff;cursor:pointer}
.edit-card button:disabled{opacity:.4;cursor:not-allowed}
.editor{margin-top:18px;padding:20px;border:1px solid #55306f;background:#0b0710}
.editor label{display:block;color:#bfaec9;font-size:.8rem;margin:12px 0 5px}
.editor input,.editor textarea,.editor select{width:100%;padding:11px;background:#08050b;color:#fff;border:1px solid #39214d;outline:none}
.editor textarea{min-height:120px;resize:vertical}
.editor-actions{display:flex;gap:9px;flex-wrap:wrap}
.save-ok{color:var(--ok);margin-top:10px}
.small-note{font-size:.8rem;color:var(--muted)}
</style>

<script>
/* VALØR editable Admin Hub upgrade */
const originalDevs = [...devs];

function valorData(){
  const d = {
    homepage:{title:"WELCOME TO VALØR",subtitle:"A professional dark/neon command interface for VALØR.",winRate:"CONFIGURABLE"},
    announcements:[], war:{active:"NH",opponent:"IGN / TSN",score:"TBD",result:"TBD",status:"ACTIVE"},
    roster:["Ban_danil","6ipzz","Damjan","Bleed","Valor"],
    stats:{members:"220+",tier:"Infinity / T5",wars:"30+",winRate:"CONFIGURABLE"},
    intel:[],media:[],rules:"",faq:[],developers:originalDevs,links:[],
    staff:[],ranks:[],divisions:[],appearance:{purple:"#9b4dff",violet:"#c46cff"},audit:[]
  };
  try{
    const saved=JSON.parse(localStorage.getItem("VALOR_ADMIN_DATA")||"null");
    return saved ? {...d,...saved,homepage:{...d.homepage,...saved.homepage},
      war:{...d.war,...saved.war},stats:{...d.stats,...saved.stats},
      appearance:{...d.appearance,...saved.appearance}} : d;
  }catch(e){return d}
}
function valorSave(data,action){
  data.audit=data.audit||[];
  data.audit.unshift({admin:window.currentAdmin?.name||"Unknown",action,time:new Date().toLocaleString()});
  data.audit=data.audit.slice(0,100);
  localStorage.setItem("VALOR_ADMIN_DATA",JSON.stringify(data));
}
function escV(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function allowed(lvl){return !!window.currentAdmin && window.currentAdmin.level>=lvl}

const editorDefs=[
 ["Dashboard",1,"dashboard","Overview of editable clan statistics and status."],
 ["Announcements",1,"announcements","Create and remove official announcements."],
 ["War Management",3,"war","Edit active war, opponent, score and result."],
 ["Active War",3,"war","Update the currently active war."],
 ["Roster Management",3,"roster","Edit the war roster and roster entries."],
 ["Staff Management",4,"staff","Edit staff information."],
 ["Rank Management",4,"ranks","Edit rank information."],
 ["Stats Management",3,"stats","Edit member count, tier, wins and win rate."],
 ["Intel Feed",3,"intel","Publish or remove intelligence updates."],
 ["Media Management",3,"media","Add or remove media entries."],
 ["Rules Management",3,"rules","Edit the Rules & Codex content."],
 ["FAQ Management",3,"faq","Create and remove FAQ entries."],
 ["Developer Management",4,"developers","Edit the developer list."],
 ["Homepage Management",3,"homepage","Edit homepage title, subtitle and win-rate display."],
 ["Links Management",3,"links","Add or remove links."],
 ["Site Appearance",5,"appearance","Change the primary neon colors."],
 ["Admin Management",5,"admin","View authorized administrators and levels."],
 ["Audit Log",3,"audit","View actions performed through the Admin Hub."]
];

function showAdmin(admin){
  const panel=document.getElementById("adminPanel"); if(!panel)return;
  panel.classList.add("show");
  panel.innerHTML=`
    <div class="admin-bar"><b>${escV(admin.name)}</b> • ${escV(admin.role)}
      <span class="permission">COMMAND LEVEL ${admin.level}</span></div>
    <div class="edit-grid">
      ${editorDefs.map(d=>`
        <div class="edit-card">
          <h3>${d[0]}</h3>
          <p class="small-note">${d[3]}</p>
          <span class="${allowed(d[1])?"ok":"danger"}">${allowed(d[1])?"ACCESS":"LOCKED"} · LVL ${d[1]}</span><br>
          <button ${allowed(d[1])?"":"disabled"} onclick="openValorEditor('${d[2]}')">
            ${allowed(d[1])?"EDIT / MANAGE":"INSUFFICIENT LEVEL"}
          </button>
        </div>`).join("")}
    </div>
    <div id="valorEditor" class="editor"></div>
    <div class="section notice">Changes are saved in this browser using local storage. On GitHub Pages, they are not shared with other visitors and are not secure server-side changes.</div>`;
}

function openValorEditor(type){
  const data=valorData(), box=document.getElementById("valorEditor");
  let h="";
  if(type==="dashboard") h=`<h3>📊 Dashboard Editor</h3>
    <label>Members</label><input id="v1" value="${escV(data.stats.members)}">
    <label>Tier</label><input id="v2" value="${escV(data.stats.tier)}">
    <label>War wins</label><input id="v3" value="${escV(data.stats.wars)}">
    <label>Win rate</label><input id="v4" value="${escV(data.stats.winRate)}">
    <button onclick="saveValor('dashboard')">SAVE DASHBOARD</button>`;
  else if(type==="homepage") h=`<h3>🏠 Homepage Management</h3>
    <label>Title</label><input id="v1" value="${escV(data.homepage.title)}">
    <label>Subtitle</label><textarea id="v2">${escV(data.homepage.subtitle)}</textarea>
    <label>Win rate display</label><input id="v3" value="${escV(data.homepage.winRate)}">
    <button onclick="saveValor('homepage')">SAVE HOMEPAGE</button>`;
  else if(type==="war") h=`<h3>⚔️ War Management</h3>
    <label>Active War</label><input id="v1" value="${escV(data.war.active)}">
    <label>Opponent</label><input id="v2" value="${escV(data.war.opponent)}">
    <label>Score</label><input id="v3" value="${escV(data.war.score)}">
    <label>Result</label><input id="v4" value="${escV(data.war.result)}">
    <label>Status</label><input id="v5" value="${escV(data.war.status)}">
    <button onclick="saveValor('war')">SAVE WAR</button>`;
  else if(type==="roster") h=`<h3>👥 Roster Management</h3>
    <label>Players — one per line</label><textarea id="v1">${escV(data.roster.join("\n"))}</textarea>
    <button onclick="saveValor('roster')">SAVE ROSTER</button>`;
  else if(type==="stats") h=`<h3>📈 Stats Management</h3>
    <label>Members</label><input id="v1" value="${escV(data.stats.members)}">
    <label>Tier</label><input id="v2" value="${escV(data.stats.tier)}">
    <label>War wins</label><input id="v3" value="${escV(data.stats.wars)}">
    <label>Win rate</label><input id="v4" value="${escV(data.stats.winRate)}">
    <button onclick="saveValor('stats')">SAVE STATS</button>`;
  else if(type==="announcements"||type==="intel"||type==="media"||type==="links")
    h=`<h3>${type==="announcements"?"📢 Announcements":type==="intel"?"📰 Intel Feed":type==="media"?"🎬 Media Management":"🔗 Links Management"}</h3>
      <label>New entry</label><textarea id="v1" placeholder="Enter content..."></textarea>
      <button onclick="addValorEntry('${type}')">ADD ENTRY</button>
      <div class="section">${(data[type]||[]).map((x,i)=>`<div class="row"><span>${escV(x)}</span><button onclick="deleteValorEntry('${type}',${i})">DELETE</button></div>`).join("")||'<span class="muted">Nothing added yet.</span>'}</div>`;
  else if(type==="rules") h=`<h3>📜 Rules & Codex</h3><label>Rules</label><textarea id="v1" style="min-height:260px">${escV(data.rules)}</textarea><button onclick="saveValor('rules')">SAVE RULES</button>`;
  else if(type==="faq") h=`<h3>❓ FAQ Management</h3>
      <label>Question</label><input id="v1"><label>Answer</label><textarea id="v2"></textarea>
      <button onclick="addValorFaq()">ADD FAQ</button>
      <div class="section">${(data.faq||[]).map((x,i)=>`<div class="row"><span><b>${escV(x.q)}</b><br>${escV(x.a)}</span><button onclick="deleteValorEntry('faq',${i})">DELETE</button></div>`).join("")||'<span class="muted">Nothing added yet.</span>'}</div>`;
  else if(type==="developers"||type==="staff"||type==="ranks"||type==="divisions")
    h=`<h3>${type==="developers"?"💻 Developer Management":type==="staff"?"🛡️ Staff Management":type==="ranks"?"🏆 Rank Management":"⚔️ Combat Divisions"}</h3>
      <label>Entries — one per line</label><textarea id="v1">${escV((data[type]||[]).join("\n"))}</textarea>
      <button onclick="saveValor('${type}')">SAVE ${type.toUpperCase()}</button>`;
  else if(type==="appearance") h=`<h3>🎨 Site Appearance</h3>
    <label>Primary Purple</label><input id="v1" value="${escV(data.appearance.purple)}">
    <label>Neon Violet</label><input id="v2" value="${escV(data.appearance.violet)}">
    <button onclick="saveValor('appearance')">APPLY APPEARANCE</button>`;
  else if(type==="admin") h=`<h3>🔐 Admin Management</h3>
    <div class="notice">Authorized administrators are fixed in this demo. Real secure admin management requires a backend.</div>
    ${Object.values(admins).map(a=>`<div class="row"><b>${escV(a.name)}</b><span>${escV(a.role)} · LVL ${a.level}</span></div>`).join("")}`;
  else if(type==="audit") h=`<h3>📋 Audit Log</h3>
    ${(data.audit||[]).map(x=>`<div class="row"><span>${escV(x.action)}</span><span class="muted">${escV(x.admin)} · ${escV(x.time)}</span></div>`).join("")||'<span class="muted">No changes yet.</span>'}`;
  box.innerHTML=h+`<div class="editor-actions"><button onclick="document.getElementById('valorEditor').innerHTML=''">CLOSE</button></div>`;
  box.scrollIntoView({behavior:"smooth",block:"start"});
}

function saveValor(type){
  const d=valorData();
  if(type==="dashboard"||type==="stats"){d.stats={members:v("v1"),tier:v("v2"),wars:v("v3"),winRate:v("v4")};}
  if(type==="homepage"){d.homepage={title:v("v1"),subtitle:v("v2"),winRate:v("v3")};}
  if(type==="war"){d.war={active:v("v1"),opponent:v("v2"),score:v("v3"),result:v("v4"),status:v("v5")};}
  if(type==="roster"){d.roster=v("v1").split(/\n/).map(x=>x.trim()).filter(Boolean);}
  if(type==="rules"){d.rules=v("v1");}
  if(["developers","staff","ranks","divisions"].includes(type)){d[type]=v("v1").split(/\n/).map(x=>x.trim()).filter(Boolean);}
  if(type==="appearance"){d.appearance={purple:v("v1"),violet:v("v2")};document.documentElement.style.setProperty("--purple",d.appearance.purple);document.documentElement.style.setProperty("--violet",d.appearance.violet);}
  valorSave(d,"Saved "+type);
  openValorEditor(type);
  refreshValorPage(type);
}
function v(id){return document.getElementById(id)?.value||""}
function addValorEntry(type){
  const d=valorData(),x=v("v1").trim();if(!x)return;d[type]=d[type]||[];d[type].push(x);valorSave(d,"Added "+type+" entry");openValorEditor(type);refreshValorPage(type)
}
function deleteValorEntry(type,i){
  const d=valorData();d[type].splice(i,1);valorSave(d,"Deleted "+type+" entry");openValorEditor(type);refreshValorPage(type)
}
function addValorFaq(){
  const q=v("v1").trim(),a=v("v2").trim();if(!q||!a)return;const d=valorData();d.faq.push({q,a});valorSave(d,"Added FAQ");openValorEditor("faq");refreshValorPage("faq")
}
function refreshValorPage(type){
  const page=location.hash.slice(1)||"home";
  if(["homepage","dashboard","stats","war","roster","rules","faq","intel","media","developers","divisions"].includes(type)) render(page);
  if(page==="admin" && window.currentAdmin) showAdmin(window.currentAdmin);
}
</script>
</body>
</html>
