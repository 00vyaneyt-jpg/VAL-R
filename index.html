<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VALØR — Futuristic Cursor Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#060606;color:#eee;font-family:Arial,sans-serif;display:grid;place-items:center;text-align:center;overflow:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 50% 40%,#222,#060606 60%)}
h1{font-size:clamp(50px,10vw,110px);letter-spacing:12px;margin:0}.muted{color:#888}
.valor-cursor-glow,.valor-cursor-dot,.valor-cursor-ring,.valor-cursor-ring2{position:fixed;left:0;top:0;pointer-events:none;z-index:10000;transform:translate(-50%,-50%)}
.valor-cursor-glow{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),rgba(255,255,255,.035) 40%,transparent 72%);filter:blur(7px);transition:.2s}
.valor-cursor-dot{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff,0 0 25px rgba(255,255,255,.65)}
.valor-cursor-ring{width:62px;height:62px;border:1px solid rgba(255,255,255,.65);border-radius:50%;animation:spin 5s linear infinite}
.valor-cursor-ring2{width:110px;height:110px;border:1px solid rgba(255,255,255,.2);border-radius:50%;animation:spin2 9s linear infinite}
.valor-cursor-ring:before,.valor-cursor-ring:after{content:"";position:absolute;width:5px;height:5px;border:1px solid #fff;transform:rotate(45deg)}
.valor-cursor-ring:before{left:-3px;top:50%}.valor-cursor-ring:after{right:-3px;top:50%}
.valor-cursor-particle{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;pointer-events:none;z-index:9999;box-shadow:0 0 8px #fff;animation:particle .7s ease-out forwards}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes spin2{to{transform:translate(-50%,-50%) rotate(-360deg)}}
@keyframes particle{to{opacity:0;transform:translate(var(--px),var(--py)) scale(.15)}}
@media(max-width:700px),(pointer:coarse){.valor-cursor-glow,.valor-cursor-dot,.valor-cursor-ring,.valor-cursor-ring2,.valor-cursor-particle{display:none}}
</style>
</head>
<body>
<div class="bg"></div><main><h1>VALØR</h1><p class="muted">Move your cursor around the page.</p></main>
<div class="valor-cursor-glow"></div><div class="valor-cursor-ring2"></div><div class="valor-cursor-ring"></div><div class="valor-cursor-dot"></div>
<script>
(()=>{const g=document.querySelector('.valor-cursor-glow'),r=document.querySelector('.valor-cursor-ring'),r2=document.querySelector('.valor-cursor-ring2'),d=document.querySelector('.valor-cursor-dot');let x=-200,y=-200,gx=x,gy=y,rx=x,ry=y;
document.addEventListener('mousemove',e=>{x=e.clientX;y=e.clientY;d.style.left=x+'px';d.style.top=y+'px';for(let i=0;i<2;i++){const p=document.createElement('i');p.className='valor-cursor-particle';p.style.left=x+'px';p.style.top=y+'px';p.style.setProperty('--px',((Math.random()-.5)*55)+'px');p.style.setProperty('--py',((Math.random()-.5)*55)+'px');document.body.appendChild(p);setTimeout(()=>p.remove(),700)}});
function loop(){gx+=(x-gx)*.08;gy+=(y-gy)*.08;rx+=(x-rx)*.16;ry+=(y-ry)*.16;g.style.left=gx+'px';g.style.top=gy+'px';r.style.left=rx+'px';r.style.top=ry+'px';r2.style.left=rx+'px';r2.style.top=ry+'px';requestAnimationFrame(loop)}loop()})();
</script>
</body></html>
